<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Nightstand: brass crescent on the app's near-black. A crescent alone
       stays legible at 16px; adding book shapes turns to mud at tab size. -->
  <rect width="32" height="32" rx="7" fill="#14100b"/>
  <mask id="crescent">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="21.5" cy="12" r="8.6" fill="#000"/>
  </mask>
  <circle cx="16" cy="16.5" r="9.2" fill="#d9a668" mask="url(#crescent)"/>
</svg>
